<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#02070d" />
  <title>Universe Game — Casino Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="stars"></div>
  <div class="nebula"></div>
  <div class="app-shell">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Abrir menú"><span></span><span></span><span></span></button>
      <a href="#home" class="brand" data-route="home" aria-label="Universe Game">
        <span class="brand-orbit orbit-a"></span><span class="brand-orbit orbit-b"></span>
        <span class="brand-planet p1"></span><span class="brand-planet p2"></span>
        <span class="brand-text"><span>UNIVERSE</span><strong>game</strong></span>
      </a>
      <button class="balance" id="balanceBtn" aria-label="Saldo"><span class="chip-dot"></span><span id="balance">1,000</span></button>
    </header>

    <aside class="drawer" id="drawer" aria-hidden="true">
      <div class="drawer-head"><div class="drawer-title">UNIVERSE <b>GAME</b></div><button class="close-btn" id="closeBtn">×</button></div>
      <nav class="drawer-nav">
        <a href="#home" data-route="home">⌂ <span>Inicio</span></a>
        <a href="#casino" data-route="casino">◈ <span>Casino</span></a>
        <a href="#games" data-route="games">✦ <span>Juegos</span></a>
        <a href="#profile" data-route="profile">◯ <span>Perfil</span></a>
      </nav>
      <div class="drawer-note"><span>DEMO</span><p>Fichas virtuales para pruebas. No hay dinero real ni retiros.</p></div>
    </aside>
    <div class="backdrop" id="backdrop"></div>

    <main id="app" class="main"></main>

    <footer class="footer"><span>UNIVERSE GAME</span><span>CASINO DEMO</span></footer>
  </div>

<script>
const app = document.getElementById('app');
const drawer = document.getElementById('drawer');
const backdrop = document.getElementById('backdrop');
const balanceEl = document.getElementById('balance');
let balance = 1000;
let selectedGame = null;
let noticeTimer;

const games = {
  'jewel-rush': {
    id:'jewel-rush', name:'Jewel Rush', kicker:'GEMA GALÁCTICA', icon:'💎', cls:'jewel', desc:'Atrapa la combinación de gemas y descubre cuánto vale tu giro.'
  },
  'cosmic-slots': {
    id:'cosmic-slots', name:'Cosmic Slots', kicker:'GIROS CÓSMICOS', icon:'★', cls:'slots', desc:'Tres carretes. Una galaxia. Girá y buscá una alineación ganadora.'
  },
  'galaxy-roulette': {
    id:'galaxy-roulette', name:'Galaxy Roulette', kicker:'RULETA ORBITAL', icon:'◎', cls:'roulette', desc:'Elegí rojo, negro o verde y probá tu suerte en la órbita.'
  }
};

function format(n){return n.toLocaleString('en-US');}
function setBalance(n){ balance=Math.max(0, Math.floor(n)); balanceEl.textContent=format(balance); }
function showNotice(text){
  clearTimeout(noticeTimer); let el=document.getElementById('toast');
  if(!el){el=document.createElement('div'); el.id='toast'; document.body.appendChild(el)}
  el.textContent=text; el.classList.add('show'); noticeTimer=setTimeout(()=>el.classList.remove('show'),2200);
}
function openMenu(){drawer.classList.add('open');backdrop.classList.add('show');drawer.setAttribute('aria-hidden','false')}
function closeMenu(){drawer.classList.remove('open');backdrop.classList.remove('show');drawer.setAttribute('aria-hidden','true')}

document.getElementById('menuBtn').onclick=openMenu;
document.getElementById('closeBtn').onclick=closeMenu;
backdrop.onclick=closeMenu;

document.addEventListener('click', e=>{
  const route=e.target.closest('[data-route]'); if(!route)return; e.preventDefault(); go(route.dataset.route); closeMenu();
  const hash=route.dataset.route==='home'?'#home':route.dataset.route==='casino'?'#casino':route.dataset.route==='games'?'#games': '#profile'; history.replaceState(null,'',hash);
});

document.getElementById('balanceBtn').onclick=()=>showNotice('Saldo de prueba: '+format(balance)+' fichas');

function go(route){
  selectedGame=null;
  if(route==='home') renderHome();
  else if(route==='casino' || route==='games') renderCasino();
  else if(route==='profile') renderProfile();
}
function renderHome(){
  app.innerHTML=`
    <section class="hero page-fade">
      <div class="hero-copy">
        <div class="eyebrow">WELCOME TO THE UNIVERSE</div>
        <h1>JUGÁ.<br><span>EXPLORÁ.</span><br>GANÁ.</h1>
        <p>Una experiencia de casino futurista con una galaxia de juegos para explorar.</p>
        <button class="primary-btn" onclick="go('casino');history.replaceState(null,'','#casino')">ENTRAR AL CASINO <span>→</span></button>
      </div>
      <div class="hero-visual">
        <div class="hero-orbit o1"></div><div class="hero-orbit o2"></div><div class="hero-orbit o3"></div>
        <div class="hero-core"><div class="core-glow"></div><div class="core-ring"></div><span>UG</span></div>
        <div class="hero-planet hp1"></div><div class="hero-planet hp2"></div><div class="hero-planet hp3"></div>
      </div>
    </section>
    <section class="section-block page-fade">
      <div class="section-head"><div><div class="eyebrow">DESTACADOS</div><h2>Explorá nuestros juegos</h2></div><button class="ghost-btn" onclick="go('casino');history.replaceState(null,'','#casino')">VER TODOS →</button></div>
      <div class="game-grid compact">${gameCards()}</div>
    </section>`;
}
function gameCards(){return Object.values(games).map(g=>`<article class="game-card ${g.cls}" onclick="openGame('${g.id}')"><div class="game-art"><div class="game-symbol">${g.icon}</div><span class="game-orb orb1"></span><span class="game-orb orb2"></span></div><div class="game-info"><span>${g.kicker}</span><h3>${g.name}</h3><button>JUGAR <b>→</b></button></div></article>`).join('')}
function renderCasino(){
  app.innerHTML=`<section class="page page-fade"><div class="section-head casino-head"><div><div class="eyebrow">UNIVERSE GAME</div><h1>CASINO</h1><p>Elegí un juego y entrá directamente.</p></div><div class="chip-badge"><span class="chip-dot"></span>${format(balance)} FICHAS</div></div><div class="featured-banner"><div><div class="eyebrow">JUEGO DESTACADO</div><h2>JEWEL RUSH</h2><p>Una lluvia de gemas desde el espacio.</p><button class="primary-btn small" onclick="openGame('jewel-rush')">JUGAR AHORA →</button></div><div class="banner-gem">💎</div></div><div class="section-head smallhead"><div><div class="eyebrow">CATÁLOGO</div><h2>Todos los juegos</h2></div></div><div class="game-grid">${gameCards()}</div></section>`;
}
function renderProfile(){
  app.innerHTML=`<section class="page page-fade profile"><div class="eyebrow">CUENTA DEMO</div><h1>PERFIL</h1><div class="profile-card"><div class="avatar">U</div><div><span>Jugador de prueba</span><h2>Universe Player</h2><small>Sesión local · Demo</small></div></div><div class="stat-row"><div><span>SALDO</span><strong>${format(balance)}</strong></div><div><span>PARTIDAS</span><strong id="plays">0</strong></div><div><span>ESTADO</span><strong>DEMO</strong></div></div><button class="ghost-btn" onclick="setBalance(1000);showNotice('Saldo reiniciado a 1,000 fichas')">↻ REINICIAR FICHAS</button></section>`;
}
function openGame(id){ selectedGame=games[id]; history.replaceState(null,'','#game/'+id); renderGame(); }
function renderGame(){
  const g=selectedGame;
  app.innerHTML=`<section class="page game-page page-fade"><button class="back-link" onclick="go('casino');history.replaceState(null,'','#casino')">← VOLVER AL CASINO</button><div class="play-header"><div><div class="eyebrow">${g.kicker}</div><h1>${g.name}</h1><p>${g.desc}</p></div><div class="chip-badge"><span class="chip-dot"></span>${format(balance)} FICHAS</div></div>${gamePanel(g)}</section>`;
}
function gamePanel(g){
 if(g.id==='jewel-rush') return `<div class="play-panel jewel-panel"><div class="jewel-board" id="jewelBoard">${Array.from({length:16},()=>'<button class="gem" onclick="pickGem(this)">◆</button>').join('')}</div><div class="bet-row"><label>APUESTA <input id="bet" type="number" min="10" max="500" step="10" value="50"></label><button class="primary-btn" onclick="playJewel()">JUGAR 50 →</button></div></div>`;
 if(g.id==='cosmic-slots') return `<div class="play-panel slots-panel"><div class="reels" id="reels"><div>☄</div><div>★</div><div>✦</div></div><div class="slots-message" id="slotsMessage">Listo para girar</div><div class="bet-row"><label>APUESTA <input id="bet" type="number" min="10" max="500" step="10" value="50"></label><button class="primary-btn" onclick="spinSlots()">GIRAR →</button></div></div>`;
 return `<div class="play-panel roulette-panel"><div class="wheel" id="wheel"><div class="wheel-label">GALAXY<br><b>ROULETTE</b></div></div><div class="bet-options"><button onclick="playRoulette('red')"><span class="red"></span> ROJO 2×</button><button onclick="playRoulette('black')"><span class="black"></span> NEGRO 2×</button><button onclick="playRoulette('green')"><span class="green"></span> VERDE 14×</button></div><div class="bet-row"><label>APUESTA <input id="bet" type="number" min="10" max="500" step="10" value="50"></label><span class="helper">Elegí un color para jugar.</span></div></div>`;
}
window.openGame=openGame; window.go=go; window.setBalance=setBalance;
window.pickGem=(btn)=>{document.querySelectorAll('.gem').forEach(x=>x.classList.remove('picked'));btn.classList.add('picked')};
function readBet(){const v=Number(document.getElementById('bet')?.value||50);return Math.max(10,Math.min(500,Math.floor(v)));}
function takeBet(bet){if(bet>balance){showNotice('No tenés suficientes fichas');return false}setBalance(balance-bet);return true}
function award(amount){setBalance(balance+amount)}
window.playJewel=()=>{const bet=readBet(); if(!takeBet(bet))return; const gems=[...document.querySelectorAll('.gem')]; gems.forEach(x=>x.classList.remove('picked')); const picks=[...Array(16).keys()].sort(()=>Math.random()-0.5).slice(0,3); picks.forEach(i=>gems[i].classList.add('picked')); const win=Math.random()<0.28?bet*2:0; if(win) award(win); showNotice(win?`¡Ganaste ${format(win)} fichas!`:`Perdiste ${format(bet)} fichas`)};
window.spinSlots=()=>{const bet=readBet(); if(!takeBet(bet))return; const symbols=['☄','★','✦','☀','♢']; const reels=document.querySelectorAll('#reels div'); reels.forEach((r,i)=>setTimeout(()=>r.textContent=symbols[Math.floor(Math.random()*symbols.length)],i*180)); const win=Math.random()<0.25?bet*3:0; setTimeout(()=>{ if(win)award(win); document.getElementById('slotsMessage').textContent=win?'¡JACKPOT CÓSMICO!':'Probá otro giro'; showNotice(win?`¡Ganaste ${format(win)} fichas!`:`Giro sin premio`);},700)};
window.playRoulette=(color)=>{const bet=readBet(); if(!takeBet(bet))return; const roll=Math.random(); const result=roll<0.03?'green':roll<0.515?'red':'black'; const mult=color==='green'?14:2; const win=result===color?bet*mult:0; if(win) award(win); showNotice(`Salió ${result.toUpperCase()} · ${win?'GANASTE '+format(win):'Sin premio'}`)};

function routeFromHash(){const h=location.hash.slice(1); if(h.startsWith('game/')){const id=h.split('/')[1]; if(games[id]){selectedGame=games[id];renderGame();return}} go(h==='casino'||h==='games'||h==='profile'||h==='home'?h:'home')}
window.addEventListener('hashchange',routeFromHash); routeFromHash();
</script>
</body>
</html>
