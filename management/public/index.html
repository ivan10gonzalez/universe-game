<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#708090"><title>Gestión de sitios</title><link rel="stylesheet" href="/management.css"><script src="/management.js" defer></script></head>
<body>
<section id="login-view" class="login-view"><form id="login-form" class="login-card"><h1><span class="fa" aria-hidden="true">&#xf007;</span> Ingreso</h1><p>Administración de sitios y cuentas</p><label>Nombre de usuario<input name="username" autocomplete="username" required maxlength="50"></label><label>Contraseña<input name="password" type="password" autocomplete="current-password" required maxlength="128"></label><p id="login-error" role="alert"></p><button type="submit" class="primary">INGRESAR</button></form></section>
<div id="panel" hidden><header class="toolbar"><button id="menu-button" class="icon-button hamburger" aria-label="Abrir menú" aria-controls="drawer" aria-expanded="false"><span class="fa" aria-hidden="true">&#xf0c9;</span></button><div class="site-label"><small>SITIO SELECCIONADO</small><strong id="selected-site">—</strong></div><div class="account-wrap"><button id="account-button" class="icon-button" aria-label="Mi cuenta" aria-expanded="false" aria-controls="account-menu"><span class="fa account-icon" aria-hidden="true">&#xf21b;</span><span class="account-name" id="account-name"></span><span class="fa account-caret" aria-hidden="true">&#xf0d7;</span></button><div id="account-menu" class="account-menu" hidden><button data-account="password">Cambiar contraseña</button><button data-account="logins">Historial de ingresos</button><button data-account="profile">Mi cuenta</button><button data-account="contact">Información de contacto</button><button data-account="logout">Salir</button></div></div></header>
<button id="backdrop" class="backdrop" hidden aria-label="Cerrar menú"></button><aside id="drawer" class="drawer" inert><div class="drawer-head"><div class="demo-logo">✦ TU LOGO AQUÍ</div><p id="identity"></p></div><nav id="navigation" aria-label="Secciones del panel"></nav></aside>
<main id="content" tabindex="-1"></main><div id="notice" class="notice" role="status" hidden></div></div>
<dialog id="dialog" aria-labelledby="dialog-title"><form id="dialog-form"><header><h2 id="dialog-title"></h2><button type="button" id="close-dialog" class="icon-button" aria-label="Cerrar">×</button></header><div id="dialog-fields"></div><p id="dialog-error" role="alert"></p><footer><button type="button" id="cancel-dialog" class="outline">CANCELAR</button><button id="dialog-submit" type="submit">ACEPTAR</button></footer></form></dialog>
</body></html>
